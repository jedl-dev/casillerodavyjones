<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dos Puertas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{--abyss:#040d10;--deep:#061a1c;--sea:#0b3538;--steel:#0e2124;--steel2:#1b3a3e;--edge:rgba(214,240,234,.2);--aqua:#2fb3ac;--glow:#8ff0e2;--foam:#f4fbf7;--muted:#93b6af;--coral:#d96f8e;--label:"Special Elite",monospace;--body:"Cormorant Garamond",Georgia,serif}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{width:1440px;height:900px;overflow:hidden;background:var(--abyss);color:var(--foam);font-family:var(--body);
    background-image:radial-gradient(90% 55% at 50% -12%,rgba(143,240,226,.2),transparent 60%),radial-gradient(70% 45% at 50% 112%,rgba(17,120,116,.18),transparent 64%),linear-gradient(180deg,#0a474b 0%,#073639 30%,#042327 60%,#020e11 100%)}
  .rock{position:absolute;inset:0;pointer-events:none;z-index:0}.rock path{fill:rgba(1,9,11,.92)}
  .ray{position:absolute;top:-8%;height:70%;width:150px;background:linear-gradient(180deg,rgba(190,255,245,.2),transparent 72%);filter:blur(22px);transform:skewX(-12deg)}.ray.a{left:22%}.ray.b{left:64%;width:230px;opacity:.6}
  .bub{position:absolute;border-radius:50%;border:1px solid rgba(220,252,246,.28);background:radial-gradient(circle at 34% 30%,#fff,rgba(143,240,226,.2) 52%,transparent 72%)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:56px;z-index:6;background:linear-gradient(90deg,#0a1d20,#071618);border-right:1px solid rgba(47,179,172,.4);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 0 30px}
  .rail .anchor{width:24px;height:24px;color:var(--aqua)}.rail .word{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--label);font-size:8px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .stage{margin-left:56px;height:900px;padding:30px 54px 26px;display:flex;flex-direction:column;position:relative;z-index:1}
  .lintel{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:22px;padding:12px 22px;border:1px solid rgba(214,240,234,.26);
    background:linear-gradient(180deg,#26464a,#132f33 48%,#0b2023);border-radius:3px 3px 0 0;box-shadow:inset 0 2px 0 rgba(214,240,234,.28),0 22px 50px rgba(0,0,0,.5)}
  .lintel:before{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:1px;background:rgba(143,240,226,.35)}
  .seal{position:relative;width:88px;height:88px;display:grid;place-items:center}
  .seal:before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(143,240,226,.26),transparent 66%);filter:blur(12px)}
  .seal:after{content:"";position:absolute;inset:-9px;border:1px solid rgba(143,240,226,.35);border-radius:50%}
  .seal .arc{position:absolute;inset:-15px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 292deg,rgba(143,240,226,.8) 358deg,transparent 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 0)}
  .seal .mark{position:relative;width:100%;height:100%}
  h1{margin:0;font-family:var(--label);font-weight:400;font-size:31px;line-height:.96;text-transform:uppercase;letter-spacing:.004em}
  h1 .aqua{display:block;color:var(--glow)}h1 .second{display:block;margin-top:6px;font-size:15px;line-height:1.12;color:var(--foam)}
  .lintel .meta{text-align:right}
  .lintel .meta .k{font-family:var(--label);font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--aqua)}
  .lintel .meta .v{display:block;margin-top:6px;font-family:var(--label);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.8}
  .lintel .meta .v b{color:var(--foam);font-weight:400}
  .doors{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;min-height:0}
  .door{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--foam);overflow:hidden;
    background:linear-gradient(155deg,#2a4a4d 0%,#173639 26%,#0d2629 60%,#091a1d 100%);
    border:1px solid rgba(214,240,234,.28);box-shadow:inset 0 2px 0 rgba(214,240,234,.3),inset 0 -60px 80px rgba(0,0,0,.5),0 26px 60px rgba(0,0,0,.5);
    clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%)}
  .door:before{content:"";position:absolute;inset:16px;border:1px solid rgba(214,240,234,.12);pointer-events:none}
  .door:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(47,179,172,.16),transparent 44%);opacity:.9}
  .door.multi:after{background:linear-gradient(0deg,rgba(244,251,247,.1),transparent 44%)}
  .door .frame{position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(10,26,28,.7);pointer-events:none}
  .rivets{position:absolute;inset:10px;pointer-events:none;opacity:.5;background-image:radial-gradient(circle,rgba(214,240,234,.8) 0 1.5px,transparent 2px),radial-gradient(circle,rgba(214,240,234,.8) 0 1.5px,transparent 2px),radial-gradient(circle,rgba(214,240,234,.8) 0 1.5px,transparent 2px),radial-gradient(circle,rgba(214,240,234,.8) 0 1.5px,transparent 2px);background-size:9px 9px;background-position:0 0,100% 0,0 100%,100% 100%;background-repeat:no-repeat}
  .port{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#0b2b2e,#061618 72%,#031013);box-shadow:0 0 0 10px #1d3a3d,0 0 0 11px rgba(214,240,234,.3),0 0 0 20px #12282b,0 0 0 21px rgba(214,240,234,.12),inset 0 0 40px rgba(47,179,172,.25),0 18px 34px rgba(0,0,0,.5)}
  .port svg{width:64%;height:64%;color:var(--glow)}
  .door .tag{position:relative;margin-top:28px;font-family:var(--label);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--aqua)}
  .door.multi .tag{color:var(--foam)}
  .door .name{position:relative;margin-top:6px;font-family:var(--label);font-size:34px;line-height:.92;text-transform:uppercase;text-align:center;padding:0 24px}
  .door .sub{position:relative;margin-top:10px;font-family:var(--label);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .handle{position:absolute;right:34px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 32%,#34575a,#12282b 60%,#08181a);box-shadow:0 0 0 1px rgba(214,240,234,.26),inset 0 0 16px rgba(0,0,0,.6),0 10px 20px rgba(0,0,0,.5);color:var(--aqua)}
  .door.multi .handle{color:var(--foam)}
  .handle svg{width:26px;height:26px}
  .seam{position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(143,240,226,.7),transparent);opacity:.7}
  .door.multi .seam{left:auto;right:0;background:linear-gradient(180deg,transparent,rgba(244,251,247,.6),transparent)}
  .base{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding:10px 16px;border:1px dashed rgba(200,240,232,.16);background:rgba(4,16,19,.55);opacity:.85}
  .base b{font-family:var(--label);font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#cfe4de}
  .base .note{font-family:var(--label);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral)}
  .base .status{font-family:var(--label);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua)}
</style>
</head>
<body>
  <svg class="rock" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0h380c-22 54-88 74-142 96-62 24-90 64-150 86C60 192 32 190 0 232Z"/><path d="M1440 0h-300c20 56 74 78 130 100 66 26 88 68 150 94 26 10 42 6 50 26Z"/><path d="M0 900V700c40 16 66 50 112 70 38 16 66 42 80 74 8 20 8 38 4 56Z"/><path d="M1440 900V690c-54 12-84 50-132 76-44 24-74 54-88 92-6 18-6 34-2 52Z"/></svg>
  <span class="ray a"></span><span class="ray b"></span>
  <span class="bub" style="left:24%;top:24%;width:9px;height:9px;opacity:.6"></span><span class="bub" style="left:52%;top:40%;width:6px;height:6px;opacity:.5"></span><span class="bub" style="left:82%;top:18%;width:12px;height:12px;opacity:.4"></span><span class="bub" style="left:66%;top:72%;width:7px;height:7px;opacity:.55"></span>
  <aside class="rail"><svg class="anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="5" r="2.4"/><path d="M12 7.5V21M5 13h14M4.5 16.5c1.6 3.2 4.2 4.5 7.5 4.5s5.9-1.3 7.5-4.5"/></svg><span class="word">Cubierta</span></aside>
  <main class="stage">
    <header class="lintel">
      <span class="seal"><span class="arc"></span><svg class="mark" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#08282b" stroke="#8ff0e2" stroke-width="2"/><circle cx="60" cy="60" r="44" fill="none" stroke="rgba(143,240,226,.4)"/><path d="M60 24l8 28 28 8-28 8-8 28-8-28-28-8 28-8z" fill="none" stroke="#8ff0e2" stroke-width="2.4"/><circle cx="60" cy="60" r="5" fill="#8ff0e2"/></svg></span>
      <h1>Has caído en el casillero<span class="aqua">de Davy D. Jones.</span><span class="second">Prepárate para algo impactante.</span></h1>
      <div class="meta"><span class="k">Reto 01 · Abierto</span><span class="v"><b>Quiz</b><br>15 preguntas · 3 vidas<br>dificultad creciente</span></div>
    </header>

    <section class="doors" aria-label="Elige cómo jugar el Quiz">
      <a class="door" href="#">
        <span class="rivets"></span><span class="seam"></span>
        <span class="port"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="8.4"/><path d="m12 4.8 1.9 5.3 5.3 1.9-5.3 1.9L12 19.2l-1.9-5.3L4.8 12l5.3-1.9Z"/></svg></span>
        <span class="tag">Solo</span><span class="name">Jugar solo</span><span class="sub">1 jugador</span>
        <span class="handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3v13M6.5 10 12 16l5.5-6"/><path d="M4 21h16"/></svg></span>
      </a>
      <a class="door multi" href="#">
        <span class="rivets"></span><span class="seam"></span>
        <span class="port"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><path d="M3.5 19c.7-2.7 2.4-4 4.5-4s3.8 1.3 4.5 4M11.5 19c.7-2.7 2.4-4 4.5-4s3.8 1.3 4.5 4"/></svg></span>
        <span class="tag">Multijugador</span><span class="name">Reta a tu tripulación</span><span class="sub">Duelo 1 vs 1</span>
        <span class="handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="9" r="2.6"/><circle cx="16" cy="9" r="2.6"/><path d="M3.5 19c.7-2.7 2.4-4 4.5-4s3.8 1.3 4.5 4M11.5 19c.7-2.7 2.4-4 4.5-4s3.8 1.3 4.5 4"/></svg></span>
      </a>
    </section>

    <footer class="base"><b>El siguiente reto</b><span class="status">1 abierto · 1 sellado</span><span class="note">Sellado · Próximamente</span></footer>
  </main>
</body>
</html>
