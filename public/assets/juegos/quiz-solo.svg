    <radialGradient id="solo-vignette" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0.45" stop-color="#02080b" stop-opacity="0"/>
      <stop offset="1" stop-color="#02080b" stop-opacity="0.6"/>
    </radialGradient>
    <radialGradient id="solo-water" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe6d2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5fe6d2" stop-opacity="0"/>
