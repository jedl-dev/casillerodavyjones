<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Un farol solitario sobre el abismo">
  <defs>
    <linearGradient id="solo-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12656a"/>
      <stop offset="0.42" stop-color="#06282c"/>
      <stop offset="1" stop-color="#04171a"/>
    </linearGradient>
    <radialGradient id="solo-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0fffb" stop-opacity="0.95"/>
      <stop offset="0.32" stop-color="#5fe6d2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2fb3ac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="solo-halo" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#9ff0e4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9ff0e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="solo-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8fff0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b8fff0" stop-opacity="0"/>
