  <path d="M1200 0H950l42 120-38 130 58 120-46 140 62 130-24 110h96Z" fill="#02080b" opacity="0.92"/>
  <path d="M0 750V600l150 26 120-40 150 44 160-58 150 62 170-40 150 20 150-10v146Z" fill="#010608" opacity="0.9"/>

